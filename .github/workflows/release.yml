name: Build release packages
on:
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: release-packages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Withdraw the superseded audio bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit v1.0.0 --draft || true
      - name: Build the portable runtime and native installers with SVG support
        run: |
          docker build -f packaging/Dockerfile.bundle -t tsmega-kit-builder .
          docker run --rm -v "$PWD:/src" tsmega-kit-builder bash -e -c '
            python3 -m unittest discover -s tests -q
            python3 -m unittest discover -s config/Jack/Drivers.d/tests -q
            python3 packaging/build_dsp.py
            python3 packaging/build_appdir.py
            python3 packaging/complete_manifest.py
            mkdir -p .cache-build
            curl -fL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o .cache-build/appimagetool.AppImage
            chmod +x .cache-build/appimagetool.AppImage
            version=$(cat VERSION)
            ARCH=x86_64 .cache-build/appimagetool.AppImage --appimage-extract-and-run --no-appstream dist/TSMega-kit.AppDir dist/TSMega-kit-$version-x86_64.AppImage
            python3 packaging/build_native.py
            sed -i "s/^# deb-src /deb-src /" /etc/apt/sources.list
            apt-get update -qq
            python3 packaging/download_runtime_sources.py
          '
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Verify final artifacts
        run: |
          version=$(cat VERSION)
          dist/TSMega-kit-$version-x86_64.AppImage --appimage-extract-and-run --self-test
          dpkg-deb --info dist/tsmega-kit_${version}_amd64.deb
          cd dist
          sha256sum TSMega-kit-$version-x86_64.AppImage tsmega-kit_${version}_amd64.deb tsmega-kit-$version-1.x86_64.rpm TSMega-kit-$version-runtime-sources.tar.gz > SHA256SUMS
      - name: Publish packages and matching runtime sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(cat VERSION)
          gh release view v$version >/dev/null 2>&1 || gh release create v$version --verify-tag --title "TSMega-kit $version" --notes-file packaging/release-notes.md
          gh release upload v$version dist/TSMega-kit-$version-x86_64.AppImage dist/tsmega-kit_${version}_amd64.deb dist/tsmega-kit-$version-1.x86_64.rpm dist/SHA256SUMS dist/TSMega-kit-$version-runtime-sources.tar.gz --clobber
